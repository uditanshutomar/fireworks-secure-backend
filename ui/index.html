<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Backend: dashboard</title>
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F9F7F5;
  --card: #FFFFFF;
  --line: #ECE7E2;
  --ink: #280016;
  --ink-2: #5E5257;
  --muted: #8A7F84;
  --safe: #610A45;
  --hack: #F98461;
  --broken: #E6E0DB;
  --serif: 'Instrument Serif', Georgia, serif;
  --sans: 'Geist', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Geist Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
.dash { max-width: 1280px; margin: 0 auto; padding: 28px clamp(14px, 3vw, 40px) 36px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 960px) { .dash > * { grid-column: 1 / -1 !important; } }
.num { font-variant-numeric: tabular-nums; }

.bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.bar-l { display: flex; align-items: center; gap: 12px; }
.bar h1 { margin: 0; font-size: 19px; font-weight: 600; }
.bar .sub { color: var(--muted); font-size: 13px; }
.badge { padding: 4px 10px; border-radius: 999px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; background: #FDE7DF; color: #A63A1F; }

.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.t-title { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.t-take { font-size: 17px; font-weight: 600; line-height: 1.3; margin-top: -8px; }
.t-take em { font-style: normal; color: var(--safe); }
.tile svg[role="img"] { display: block; width: 100%; height: auto; }
.s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; }

.kpi .v { font-family: var(--serif); font-size: 64px; line-height: 0.9; }
.kpi .v small { font-family: var(--sans); font-size: 15px; color: var(--muted); margin-left: 6px; }
.kpi .d { font-size: 13.5px; color: var(--ink-2); }
.kpi.hl { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.kpi.hl .t-title, .kpi.hl .d, .kpi.hl .v small { color: rgba(249, 247, 245, 0.72); }
.up { color: var(--safe); font-weight: 600; }
.kpi.hl .up { color: #FFB59C; }

.key { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.g22 { display: grid; grid-template-columns: 64px repeat(2, minmax(0, 1fr)); gap: 8px; }
.g22 .h { font-size: 12px; color: var(--muted); display: flex; align-items: center; }
.g22 .h.c { justify-content: center; }
.c22 { border-radius: 12px; padding: 12px 14px; min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; }
.c22 .p { font-family: var(--serif); font-size: 42px; line-height: 1; }
.c22 .l { font-size: 12px; }
.c22.dark { color: var(--paper); }

.fix-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-family: var(--sans); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.step[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
select { min-height: 38px; padding: 0 12px; font-family: var(--sans); font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; max-width: 100%; }
.code { background: #1A0710; color: #EFE9EC; font-family: var(--mono); font-size: 12.5px; line-height: 1.75; padding: 12px 0; border-radius: 12px; overflow-x: auto; }
.ln { display: flex; padding-right: 16px; min-width: max-content; }
.ln .n { width: 34px; flex: none; text-align: right; padding-right: 12px; color: #8E7D85; user-select: none; }
.ln .t { white-space: pre; }
.ln.bad { background: rgba(249, 132, 97, 0.28); }
.ln.new { background: rgba(214, 120, 180, 0.28); }
.tk-k { color: #F0A6D2; } .tk-s { color: #FFC2A8; }
.verdict { font-size: 14px; color: var(--ink-2); }
.verdict b { color: var(--ink); }
.empty { font-size: 13px; color: var(--muted); }
.foot { grid-column: 1 / -1; font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<main class="dash">
  <div class="bar">
    <div class="bar-l"><img src="assets/logo-mark.svg" width="26" height="26" alt=""><div><h1>Secure Backend</h1><div class="sub" id="sub"></div></div></div>
    <span class="badge" id="sample" hidden>Sample data</span>
  </div>

  <div class="tile kpi s4" id="k1"></div>
  <div class="tile kpi hl s4" id="k2"></div>
  <div class="tile kpi s4" id="k3"></div>

  <section class="tile s7"><div class="t-title">Out of 100 apps</div><div class="t-take" id="o-t"></div>
    <div class="key"><span><i class="sw" style="background:var(--safe)"></i>Safe</span><span><i class="sw" style="background:var(--hack)"></i>Works, but hacked</span><span><i class="sw" style="background:var(--broken)"></i>Doesn't work</span></div>
    <div id="outcomes"></div></section>
  <section class="tile s5"><div class="t-title">What each change adds</div><div class="t-take" id="g-t"></div><div class="g22" id="g22"></div></section>

  <section class="tile s8">
    <div class="fix-top"><div><div class="t-title">One app, before and after</div><div class="t-take" style="margin-top:6px" id="f-t"></div></div><select id="run-pick" aria-label="Choose an app"></select></div>
    <div class="steps" id="steps"></div>
    <div class="code" id="code" aria-label="App code"></div>
    <div class="verdict" id="verdict"></div>
  </section>
  <section class="tile s4"><div class="t-title">Safe apps per $1</div><div class="t-take" id="c-t"></div><div id="dollar"></div></section>

  <div class="foot" id="foot"></div>
</main>

<script src="data.js"></script>
<script>
(function () {
  const D = window.DASHBOARD_DATA || { results: { arms: [] }, runs: [] };
  const R = D.results || { arms: [] };
  const IDS = ['A1', 'A2', 'A3', 'A4', 'A5'];
  const ARMS = (R.arms || []).filter(a => IDS.includes(a.arm));
  const A = {}; ARMS.forEach(a => { A[a.arm] = a; });
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const P = x => Math.round(x * 100);
  const NAME = { A1: 'Big model (DeepSeek)', A2: 'Small model', A3: 'Small + retries', A4: 'Trained small', A5: 'Trained small + retries' };
  const nm = id => NAME[id] || id;
  const T = (x, y, txt, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a || 'start'}" font-family="${o.mono ? 'Geist Mono, monospace' : 'Geist, sans-serif'}" font-size="${o.s || 13}" font-weight="${o.w || 400}" fill="${o.c || '#280016'}">${txt}</text>`;

  const best = ARMS.slice().sort((a, b) => b.secure_pass_rate - a.secure_pass_rate)[0], base = A.A2, big = A.A1;
  $('sub').textContent = `${R.scenarios || '?'} backend tasks, ${R.runs_per_scenario || '?'} tries each, attacked with real exploits`;
  if (R.FAKE) $('sample').hidden = false;
  $('foot').textContent = 'Safe means every test passed and no attack got in. Cost counts every model call, retries included.';

  const kpi = (id, title, v, d) => { $(id).innerHTML = `<div class="t-title">${title}</div><div class="v num">${v}<small>safe / 100</small></div><div class="d">${d}</div>`; };
  if (base) kpi('k1', 'Small model, as is', P(base.secure_pass_rate), 'The starting point.');
  if (best) kpi('k2', 'Our best: ' + esc(nm(best.arm)), P(best.secure_pass_rate), base && best !== base ? `<span class="up">+${P(best.secure_pass_rate) - P(base.secure_pass_rate)} safe apps</span> over the small model.` : '');
  if (big) kpi('k3', 'Big model, for scale', P(big.secure_pass_rate), best && best !== big ? (best.secure_pass_rate > big.secure_pass_rate ? `Our small model beats it by <span class="up">${P(best.secure_pass_rate) - P(big.secure_pass_rate)}</span>.` : 'Our small model hasn’t caught up yet.') : '');

  // Out of 100 apps
  (function () {
    const order = ['A2', 'A3', 'A4', 'A5', 'A1'].filter(id => A[id]);
    const W = 700, rowH = 44, left = 180, H = order.length * rowH;
    const X = v => left + v * (W - left);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Safe, hacked and broken apps out of 100 for each setup">`;
    order.forEach((id, i) => {
      const a = A[id], y = i * rowH + 6, h = 30;
      s += T(0, y + 20, esc(nm(id)), { w: id === best.arm ? 700 : 500, c: id === best.arm ? '#610A45' : '#280016' });
      let x0 = 0;
      [[a.secure_pass_rate, '#610A45', '#F9F7F5'], [a.functional_pass_rate - a.secure_pass_rate, '#F98461', '#280016'], [1 - a.functional_pass_rate, '#E6E0DB', '#8A7F84']].forEach(([v, f, tc], k) => {
        if (v <= 0) return;
        s += `<rect x="${X(x0)}" y="${y}" width="${Math.max(0, X(x0 + v) - X(x0) - 2)}" height="${h}" rx="6" fill="${f}"></rect>`;
        if (v >= 0.07) s += T(X(x0) + 10, y + 20, P(v), { mono: 1, c: tc, w: k === 0 ? 600 : 400 });
        x0 += v;
      });
    });
    $('outcomes').innerHTML = s + '</svg>';
    if (base && best !== base) $('o-t').innerHTML = `From <em>${P(base.secure_pass_rate)}</em> to <em>${P(best.secure_pass_rate)}</em> safe apps.`;
  })();

  // What each change adds
  (function () {
    const cell = id => {
      const a = A[id];
      if (!a) return '<div class="c22" style="background:#F4F0EC"><div class="l">no data yet</div></div>';
      const t = Math.max(0, Math.min(1, a.secure_pass_rate / best.secure_pass_rate)), mix = (x, y) => Math.round(x + (y - x) * t);
      return `<div class="c22 ${t > 0.55 ? 'dark' : ''}" style="background:rgb(${mix(244, 97)},${mix(240, 10)},${mix(236, 69)})"><div class="p num">${P(a.secure_pass_rate)}</div><div class="l">safe / 100</div></div>`;
    };
    $('g22').innerHTML = `<div></div><div class="h c">One try</div><div class="h c">With retries</div><div class="h">Small</div>${cell('A2')}${cell('A3')}<div class="h">Trained</div>${cell('A4')}${cell('A5')}`;
    if (!['A2', 'A3', 'A4', 'A5'].every(id => A[id])) return;
    const s = id => A[id].secure_pass_rate;
    const train = Math.round(((s('A4') - s('A2')) + (s('A5') - s('A3'))) / 2 * 100), retry = Math.round(((s('A3') - s('A2')) + (s('A5') - s('A4'))) / 2 * 100);
    $('g-t').innerHTML = `Training <em>+${train}</em>, retries <em>+${retry}</em>. Together <em>+${P(s('A5')) - P(s('A2'))}</em>.`;
  })();

  // Safe apps per $1
  (function () {
    const rows = ['A2', 'A3', 'A4', 'A5', 'A1'].filter(id => A[id] && A[id].cost_per_secure_app_usd).map(id => ({ id, v: 1 / A[id].cost_per_secure_app_usd }));
    if (!rows.length) { $('dollar').innerHTML = '<div class="empty">No safe apps yet.</div>'; return; }
    const top = rows.slice().sort((a, b) => b.v - a.v)[0], max = top.v;
    const W = 380, rowH = 40, left = 150, H = rows.length * rowH;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Safe apps per dollar">`;
    rows.forEach((r, i) => {
      const y = i * rowH + 6, w = Math.max(2, (W - left - 44) * r.v / max);
      s += T(0, y + 15, esc(nm(r.id)), { s: 12.5 }) + `<rect x="${left}" y="${y}" width="${w}" height="22" rx="5" fill="${r.id === top.id ? '#610A45' : '#E6E0DB'}"></rect>` + T(left + w + 8, y + 15, Math.round(r.v), { mono: 1, s: 12.5 });
    });
    $('dollar').innerHTML = s + '</svg>';
    $('c-t').innerHTML = `Best value: <em>${esc(nm(top.id).toLowerCase())}</em>.`;
  })();

  // One app, before and after
  const ATTACK = { 20: 'accepts bad input', 22: 'reads files it shouldn’t', 78: 'runs attacker commands', 79: 'injects code into pages', 89: 'tricks the database', 284: 'skips permission checks', 400: 'can be overloaded', 703: 'crashes on odd input' };
  const atk = n => ATTACK[n] || 'an attack';
  const RUNS = (D.runs || []).filter(r => IDS.includes(r.arm)).sort((a, b) => ((b.rounds > 1 && b.secure_pass) - (a.rounds > 1 && a.secure_pass)));
  const pick = $('run-pick');
  pick.innerHTML = RUNS.map((r, i) => `<option value="${i}">${esc(`${nm(r.arm)} · ${r.scenario}`)}</option>`).join('');
  let cur = { run: 0, step: 0 };
  const KW = /\b(from|import|def|return|if|else|for|in|not|and|or|with|as|class|try|except|None|True|False)\b/g;
  const hl = line => {
    const re = /([rbfRBF]{0,2}"(?:[^"\\]|\\.)*"|[rbfRBF]{0,2}'(?:[^'\\]|\\.)*')/g, out = [];
    let last = 0, m;
    while ((m = re.exec(line))) { out.push(esc(line.slice(last, m.index)).replace(KW, '<span class="tk-k">$1</span>'), `<span class="tk-s">${esc(m[0])}</span>`); last = m.index + m[0].length; }
    return out.join('') + esc(line.slice(last)).replace(KW, '<span class="tk-k">$1</span>');
  };
  function renderRun() {
    const r = RUNS[cur.run];
    if (!r) { $('code').innerHTML = '<div class="empty" style="padding:12px 16px">No app records yet.</div>'; return; }
    const steps = r.steps || [], st = steps[cur.step], prev = steps[cur.step - 1], next = steps[cur.step + 1];
    const lab = s => s.secure_pass ? ['#610A45', 'Safe'] : s.exploits_triggered.length ? ['#F98461', 'Hacked'] : ['#C9C2C2', 'Doesn’t work'];
    $('steps').innerHTML = steps.map((s, i) => { const [c, t] = lab(s); return `<button type="button" class="step" data-i="${i}" aria-pressed="${i === cur.step}"><i class="dot" style="background:${c}"></i>${i === 0 ? 'First try' : 'Retry ' + i}: ${t}</button>`; }).join('');
    const nextSet = new Set(next ? next.code.split('\n') : []), prevSet = new Set(prev ? prev.code.split('\n') : []);
    $('code').innerHTML = st.code.replace(/\n$/, '').split('\n').map((t, i) => {
      const cls = next && !st.secure_pass && t.trim() && !nextSet.has(t) ? 'bad' : prev && t.trim() && !prevSet.has(t) ? 'new' : '';
      return `<div class="ln ${cls}"><span class="n">${i + 1}</span><span class="t">${hl(t)}</span></div>`;
    }).join('');
    const names = s => s.exploits_triggered.map(e => atk(e.cwe)).join(', ');
    $('f-t').innerHTML = steps.length > 1 && steps[steps.length - 1].secure_pass ? `Hacked on the first try, <em>safe after feedback</em>.` : esc(nm(r.arm));
    $('verdict').innerHTML = st.secure_pass
      ? `<b>Safe.</b> ${prev && prev.exploits_triggered.length ? `The attack that ${esc(names(prev))} no longer works. The pink line is the fix.` : 'No attack got in.'}`
      : st.exploits_triggered.length ? `<b>Hacked:</b> the attacker ${esc(names(st))} through the orange line. We told the model what failed, never the attack itself.`
      : `<b>Doesn’t work:</b> ${st.failed_tests.length} test${st.failed_tests.length === 1 ? '' : 's'} failed.`;
    $('steps').querySelectorAll('.step').forEach(b => b.addEventListener('click', () => { cur.step = +b.dataset.i; renderRun(); }));
  }
  pick.addEventListener('change', () => { cur = { run: +pick.value, step: 0 }; renderRun(); });
  renderRun();
})();
</script>
</body>
</html>
